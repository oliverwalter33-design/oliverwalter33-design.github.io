<!doctype html><meta charset="utf-8"><title>bridge</title>
<script>
// Temporäre Hilfsseite zum Hochladen der Store-Bilder (wird nach dem Einreichen gelöscht)
addEventListener('message', async (e) => {
  if (!e.data || !e.data.want) return;
  try {
    const r = await fetch(e.data.want, { cache: 'no-store' });
    const b = await r.arrayBuffer();
    e.source.postMessage({ id: e.data.id, ok: r.ok, buf: b }, '*', [b]);
  } catch (err) { e.source.postMessage({ id: e.data.id, ok: false, err: String(err) }, '*'); }
});
const t = window.opener || window.parent;
if (t && t !== window) t.postMessage({ bridge: 'ready' }, '*');
</script>
